<!DOCTYPE html>
<html lang="en">
<head>
    <title>Thực hành Bảo mật thông tin nâng cao</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px;
            border-radius: 5px;
            color: white;
            z-index: 1000;
            display: none;
        }
        .notification.success {
            background-color: #28a745;
        }
        .notification.error {
            background-color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-center align-items-center">
            <img src="https://file1.hutech.edu.vn/file/editor/homepage/stories/hinh34/logo%20CMYK-01.png" alt="logo hutech" style="width: 30%;">
            <img src="https://file1.hutech.edu.vn/file/editor/homepage1/449223-imgpsh_fullsize_anim-6.jpg" alt="logo hutech" style="width: 30%; margin-left: 20px;">
        </div>
        <h4 style="font-weight: bold; text-align: center;">BÀI THỰC HÀNH BUỔI THỨ 6 - MÔN HỌC : THBMTTNC</h4>
        <h4 style="font-weight: bold; text-align: center;">NGUYỄN KHÁNH HUÂN 2280601086 GG!</h4>
        <ul style="margin-top: 30px; list-style: none;">
            <li style="margin-bottom: 10px;">
                <button class="btn btn-primary d-block w-100" onclick="launchCaesarApp()">Caesar Cipher</button>
            </li>
            <li style="margin-bottom: 10px;">
                <button class="btn btn-success d-block w-100 mt-2" onclick="launchVigenereApp()">Vigenere Cipher</button>
            </li>
            <li style="margin-bottom: 10px;">
                <button class="btn btn-warning d-block w-100 mt-2" onclick="launchRailfenceApp()">Rail Fence Cipher</button>
            </li>
            <li style="margin-bottom: 10px;">
                <button class="btn btn-info d-block w-100 mt-2" onclick="launchPlayfairApp()">Playfair Cipher</button>
            </li>
        </ul>
    </div>

    <!-- Notification element -->
    <div id="notification" class="notification"></div>

    <script>
        // Hàm hiển thị thông báo
        function showNotification(message, type) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type}`;
            notification.style.display = 'block';
            
            // Tự động ẩn sau 3 giây
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }

        function launchCaesarApp() {
            console.log('Caesar button clicked'); // Debug log
            fetch('/launch/caesar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    showNotification('Caesar Cipher application launched successfully!', 'success');
                } else {
                    showNotification('Error: ' + data.message, 'error');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showNotification('Failed to launch Caesar Cipher application', 'error');
            });
        }

        function launchVigenereApp() {
            console.log('Vigenere button clicked'); // Debug log
            fetch('/launch/vigenere', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    showNotification('Vigenere Cipher application launched successfully!', 'success');
                } else {
                    showNotification('Error: ' + data.message, 'error');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showNotification('Failed to launch Vigenere Cipher application', 'error');
            });
        }

        function launchRailfenceApp() {
            console.log('Railfence button clicked'); // Debug log
            fetch('/launch/railfence', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    showNotification('Rail Fence Cipher application launched successfully!', 'success');
                } else {
                    showNotification('Error: ' + data.message, 'error');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showNotification('Failed to launch Rail Fence Cipher application', 'error');
            });
        }

        function launchPlayfairApp() {
            console.log('Playfair button clicked'); // Debug log
            fetch('/launch/playfair', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    showNotification('Playfair Cipher application launched successfully!', 'success');
                } else {
                    showNotification('Error: ' + data.message, 'error');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showNotification('Failed to launch Playfair Cipher application', 'error');
            });
        }
    </script>
</body>
</html>
