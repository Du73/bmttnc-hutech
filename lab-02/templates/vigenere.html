<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <table class="table">
            <tr>
                <td style="text-align: center; font-weight: bold; font-size: 25px;">VIGENÈRE CIPHER</td>
            </tr>
            <tr>
                <td style="font-weight: bold; color :aquamarine;">ENCRYPTION</td>
            </tr>
            <tr>
                <td>
                    <form method="post" action="./vigenere/encrypt">
                        <div class="mb-3">
                            <label class="form-label" for="">PLAIN TEXT</label>
                            <input type="text" class="form-control" name="inputPlainText" placeholder="Input Plain Text" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="">Key: </label>
                            <input type="text" class="form-control" name="inputKey" placeholder="Input Key" required>
                        </div>
                        <button type="submit" class="btn btn-primary">ENCRYPT</button>
                    </form>
                </td>
            </tr>
            <tr>
                <td style="font-weight: bold; color :aquamarine;">DECRYPTION</td>
            </tr>
            <tr>
                <td>
                    <form method="post" action="./vigenere/decrypt">
                        <div class="mb-3">
                            <label class="form-label" for="">Cipher Text: </label>
                            <input type="text" class="form-control" name="inputCipherText" placeholder="Input Cipher Text" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="">Key: </label>
                            <input type="text" class="form-control" name="inputKey" placeholder="Input Key" required>
                        </div>
                        <button type="submit" class="btn btn-success">DECRYPT</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>
</body>
</html>
